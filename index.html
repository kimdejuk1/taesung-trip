<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>태성고 체험학습</title>
<meta name="description" content="태성고 2학년 주제별 체험학습 팀별 일정과 버스·객실 안내">
<meta name="theme-color" content="#0b2d47">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="체험학습">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{ --brand:#0b2d47; --brand-2:#1f6fb2; }
  html,body{margin:0;height:100%;background:var(--brand);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif}
  body{display:flex;flex-direction:column}
  .safe-top{height:env(safe-area-inset-top);background:var(--brand);flex:none}
  iframe{flex:1;width:100%;border:0;background:#f2f4f8}
  .bar{flex:none;display:none;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid #dfe4ec;font-size:14px;color:#172131}
  .bar.show{display:flex}
  .bar img{width:36px;height:36px;border-radius:8px;flex:none}
  .bar .t{flex:1;line-height:1.35}
  .bar .t b{display:block;font-size:14px}
  .bar .t span{font-size:12.5px;color:#5f6b7d}
  .bar button{border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}
  .bar .go{background:var(--brand-2);color:#fff}
  .bar .x{background:none;color:#5f6b7d;padding:8px 6px;font-size:18px;line-height:1}
  .ios{position:fixed;inset:0;background:rgba(10,20,35,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .ios.show{display:flex}
  .ios .sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;padding:22px 20px calc(22px + env(safe-area-inset-bottom));font-size:15px;color:#172131}
  .ios h3{margin:0 0 12px;font-size:17px}
  .ios ol{margin:0;padding-left:20px;line-height:1.9}
  .ios .k{display:inline-block;border:1px solid #dfe4ec;border-radius:6px;padding:0 6px;font-size:13px;background:#f5f7fb}
  .ios button{width:100%;margin-top:16px;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:700;background:var(--brand-2);color:#fff}
  .bar.push{background:#eaf3fd;border-bottom-color:#b8d3f0}
  .bar .ic{font-size:26px;width:36px;text-align:center;flex:none}
  .ios .teams{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
  .ios .teams button{margin:0;padding:12px 0;background:#eef2f7;color:#172131;font-weight:500}
  .ios .teams button.on{background:var(--brand-2);color:#fff;font-weight:700}
  .ios p{margin:0 0 10px;line-height:1.6;color:#3b4656;font-size:14px}
  .ios .sub{background:none;color:#5f6b7d;margin-top:6px;font-weight:500}
  .toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#172131;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;display:none;max-width:90%;text-align:center}
  .toast.show{display:block}
  .ios .arrow{text-align:center;font-size:28px;margin-top:6px;color:var(--brand-2)}
</style>
</head>
<body>
<div class="safe-top"></div>

<div class="bar" id="installBar">
  <img src="icons/icon-192.png" alt="">
  <div class="t"><b>앱으로 설치하기</b><span>홈 화면에서 바로 열 수 있어요</span></div>
  <button class="go" id="installBtn">설치</button>
  <button class="x" id="closeBar" aria-label="닫기">✕</button>
</div>

<div class="bar push" id="pushBar">
  <div class="ic">🔔</div>
  <div class="t"><b>선생님 알림 받기</b><span>집합 시간·변경 사항을 바로 알려 드려요</span></div>
  <button class="go" id="pushBtn">켜기</button>
  <button class="x" id="pushClose" aria-label="닫기">✕</button>
</div>

<iframe id="app" title="태성고 체험학습" allow="clipboard-write"></iframe>

<div class="ios" id="iosGuide">
  <div class="sheet">
    <h3>아이폰에서 앱으로 설치하기</h3>
    <ol>
      <li>화면 아래(또는 위)의 <span class="k">공유 ⬆︎</span> 버튼을 누르세요.</li>
      <li>목록을 내려 <span class="k">홈 화면에 추가 ⊞</span>를 누르세요.</li>
      <li>오른쪽 위 <span class="k">추가</span>를 누르면 끝!</li>
    </ol>
    <div class="arrow">⬇︎</div>
    <button id="iosOk">확인</button>
  </div>
</div>

<div class="ios" id="pushSheet">
  <div class="sheet">
    <h3>🔔 알림 받기</h3>
    <p>내 팀을 고르면 전체 알림과 우리 팀 알림을 받을 수 있어요. 다음 화면에서 <b>허용</b>을 눌러 주세요.</p>
    <div class="teams" id="pushTeams">
      <button data-t="A">A팀</button><button data-t="B">B팀</button><button data-t="C">C팀</button><button data-t="교사">교사</button>
    </div>
    <button id="pushOk">알림 켜기</button>
    <button class="sub" id="pushLater">나중에</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // 앱스크립트 웹앱 주소 (배포 후 입력)
  var APP_URL = 'https://script.google.com/macros/s/AKfycbyl1UkMZwVSOS3S_WzwEtHZNXq6yGh31m8QpRYLEpUyGcGFj2DkMz1wPVf9cfnNMogs/exec';
  document.getElementById('app').src = APP_URL;

  function store(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }

  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var bar = document.getElementById('installBar');
  var deferred = null;

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }

  // 안드로이드·크롬: 설치 버튼
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferred = e;
    if (!standalone && load('hideBar') !== '1') bar.classList.add('show');
  });
  document.getElementById('installBtn').onclick = function(){
    if (deferred) {
      deferred.prompt();
      deferred.userChoice.then(function(){ deferred = null; bar.classList.remove('show'); });
    } else if (isIOS()) {
      document.getElementById('iosGuide').classList.add('show');
    }
  };
  document.getElementById('closeBar').onclick = function(){ bar.classList.remove('show'); store('hideBar', '1'); };
  window.addEventListener('appinstalled', function(){ bar.classList.remove('show'); });

  // 아이폰·아이패드(사파리): 홈 화면에 추가 안내
  function isIOS(){
    var ua = navigator.userAgent;
    return /iPhone|iPad|iPod/.test(ua) || (ua.indexOf('Macintosh') >= 0 && 'ontouchend' in document);
  }
  if (isIOS() && !standalone && load('hideBar') !== '1') {
    document.querySelector('#installBar .t span').textContent = '공유 → 홈 화면에 추가';
    document.getElementById('installBtn').textContent = '방법 보기';
    bar.classList.add('show');
    if (load('iosShown') !== '1') { document.getElementById('iosGuide').classList.add('show'); store('iosShown', '1'); }
  }
  document.getElementById('iosOk').onclick = function(){ document.getElementById('iosGuide').classList.remove('show'); };

  /* ── 선생님 알림 (Firebase Cloud Messaging) ── */
  var FB_VER = '10.12.2';
  var TEAMS = ['A', 'B', 'C', '교사'];
  var pushCfg = null, pickTeam = load('pushTeam') || load('myTeam') || '';
  var pushBar = document.getElementById('pushBar'), pushSheet = document.getElementById('pushSheet');

  function toast(t){ var e = document.getElementById('toast'); e.textContent = t; e.classList.add('show'); setTimeout(function(){ e.classList.remove('show'); }, 3500); }
  function pushSupported(){
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return false;
    return !isIOS() || standalone;   // 아이폰은 홈 화면에 추가한 앱에서만 알림 가능 (iOS 16.4 이상)
  }
  function markTeams(){
    document.querySelectorAll('#pushTeams button').forEach(function(b){ b.classList.toggle('on', b.dataset.t === pickTeam); });
  }
  document.querySelectorAll('#pushTeams button').forEach(function(b){ b.onclick = function(){ pickTeam = b.dataset.t; markTeams(); }; });

  function subscribe(team){
    var fb;
    return Promise.all([
      import('https://www.gstatic.com/firebasejs/' + FB_VER + '/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/' + FB_VER + '/firebase-messaging.js')
    ]).then(function(m){
      fb = m;
      return fb[1].isSupported();
    }).then(function(ok){
      if (!ok) throw new Error('이 브라우저는 알림을 지원하지 않습니다.');
      var app = fb[0].getApps().length ? fb[0].getApp() : fb[0].initializeApp(pushCfg.config);
      return navigator.serviceWorker.ready.then(function(reg){
        return fb[1].getToken(fb[1].getMessaging(app), { vapidKey: pushCfg.vapid, serviceWorkerRegistration: reg });
      });
    }).then(function(token){
      if (!token) throw new Error('알림 등록에 실패했습니다.');
      return fetch(APP_URL, { method: 'POST', body: JSON.stringify({ api: 'push-register', token: token, team: team, old: load('pushToken') || '' }) })
        .then(function(r){ return r.json(); })
        .then(function(r){ if (!r.ok) throw new Error(r.error || '알림 등록에 실패했습니다.'); store('pushToken', token); store('pushTeam', team); });
    });
  }

  document.getElementById('pushBtn').onclick = function(){ markTeams(); pushSheet.classList.add('show'); };
  document.getElementById('pushClose').onclick = function(){ pushBar.classList.remove('show'); store('pushLater', String(Date.now())); };
  document.getElementById('pushLater').onclick = function(){ pushSheet.classList.remove('show'); pushBar.classList.remove('show'); store('pushLater', String(Date.now())); };
  document.getElementById('pushOk').onclick = function(){
    if (TEAMS.indexOf(pickTeam) < 0){ toast('먼저 팀을 골라 주세요.'); return; }
    var btn = this; btn.disabled = true;
    // 권한 요청은 버튼을 누른 즉시 해야 함 (아이폰)
    Notification.requestPermission().then(function(perm){
      if (perm !== 'granted') throw new Error('알림이 허용되지 않았습니다. 휴대폰 설정에서 알림을 허용해 주세요.');
      return subscribe(pickTeam);
    }).then(function(){
      pushSheet.classList.remove('show'); pushBar.classList.remove('show');
      toast('알림이 켜졌어요 (' + (pickTeam === '교사' ? '교사' : pickTeam + '팀') + ')');
    }).catch(function(e){ toast(e.message || String(e)); })
      .then(function(){ btn.disabled = false; });
  };

  // 앱 화면에서 학생이 조회한 팀을 받아 알림 팀으로 사용
  window.addEventListener('message', function(e){
    var host = ''; try { host = new URL(e.origin).hostname; } catch (_) {}
    if (!/\.googleusercontent\.com$/.test(host) || !e.data || e.data.type !== 'trip-team' || TEAMS.indexOf(e.data.team) < 0) return;
    store('myTeam', e.data.team);
    if (!load('pushTeam')) { pickTeam = e.data.team; markTeams(); }
    else if (load('pushTeam') !== e.data.team && load('pushTeam') !== '교사' && pushCfg && Notification.permission === 'granted') {
      subscribe(e.data.team).then(function(){ toast('알림 팀이 ' + e.data.team + '팀으로 바뀌었어요'); }).catch(function(){});
    }
  });

  if (pushSupported()) {
    fetch(APP_URL + '?api=push-config').then(function(r){ return r.json(); }).then(function(c){
      if (!c || !c.enabled) return;
      pushCfg = c;
      if (Notification.permission === 'granted' && load('pushTeam')) {
        subscribe(load('pushTeam')).catch(function(){});   // 토큰 갱신
      } else if (Notification.permission !== 'denied') {
        var later = Number(load('pushLater') || 0);
        if (Date.now() - later > 12 * 3600 * 1000) pushBar.classList.add('show');
      }
    }).catch(function(){});
  }
</script>
</body>
</html>
